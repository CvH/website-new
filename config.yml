# LibreELEC Downloads Configuration
# To add a new version site-wide, simply add a new entry to the `versions` list below.
# The site will automatically update the hero CTA, download page, version selectors, and URLs.

baseUrl: "https://releases.libreelec.tv"

# USB-SD Creator Tool Releases
creator:
  version: "1.0.0"
  wikiUrl: "https://wiki.libreelec.tv/installation/create-media"
  downloads:
    windows:
      name: "Windows x64 (.exe)"
      icon: "fa-brands fa-windows"
      url: "https://releases.libreelec.tv/LibreELEC.USB-SD.Creator.Win32.exe"
    macos:
      name: "macOS (.dmg)"
      icon: "fa-brands fa-apple"
      url: "https://releases.libreelec.tv/LibreELEC.USB-SD.Creator.macOS.dmg"
    linux:
      name: "Linux (.AppImage)"
      icon: "fa-brands fa-linux"
      url: "https://releases.libreelec.tv/LibreELEC.USB-SD.Creator.Linux-64bit.AppImage"

# Supported LibreELEC Versions (Ordered from newest to oldest)
# First version with status 'latest' or first in list is treated as the site-wide latest release
versions:
  - id: "12.2"
    name: "12.2"
    downloadVersion: "12.2.1"
    releaseDate: "2025.11"
    kodiVersion: "21.3 (Omega)"
    kernelVersion: "6.16.x"
    kernelOverrides:
      raspberry: "6.12.x"
    status: "latest" # 'latest' | 'stable' | 'legacy' | 'prerelease'
    description: "Latest stable release featuring Kodi 21.3 Omega with wide hardware decoding support."

  - id: "12.0"
    name: "12.0"
    downloadVersion: "12.0.2"
    releaseDate: "2025.01"
    kodiVersion: "21.2 (Omega)"
    kernelVersion: "6.6.x"
    status: "stable"
    description: "Stable LibreELEC 12 series release with 64-bit aarch64 userspace for ARM SoCs."

  - id: "11.0"
    name: "11.0"
    downloadVersion: "11.0.6"
    releaseDate: "2024.01"
    kodiVersion: "20.3 (Nexus)"
    kernelVersion: "6.1.x"
    status: "legacy"
    description: "Legacy release powered by Kodi 20.3 Nexus."

  - id: "10.0"
    name: "10.0"
    downloadVersion: "10.0.4"
    releaseDate: "2023.01"
    kodiVersion: "19.5 (Matrix)"
    kernelVersion: "5.10.x"
    status: "legacy"
    description: "Legacy release featuring Kodi 19.5 Matrix."

  - id: "9.2"
    name: "9.2"
    downloadVersion: "9.2.6"
    downloadVersionOverrides:
      RPi: "9.2.8"
      RPi2: "9.2.8"
      RPi4: "9.2.8"
    releaseDate: "2020.11"
    kodiVersion: "18.9 (Leia)"
    kernelVersion: "5.1.x"
    kernelOverrides:
      raspberry: "4.19.x"
      rockchip: "4.4.x"
    status: "legacy"
    description: "Python 2 based legacy release for vintage hardware."

# Platforms and Supported Hardware Catalog
